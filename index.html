<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale / user-scalable are deliberately absent: pinning them blocks
         pinch-zoom, which people with low vision rely on (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090D14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <title>Suhbatdosh — English Speaking Partner</title>
    <meta
      name="description"
      content="Practise speaking English with real people. Get matched with a partner in seconds, or sit a full IELTS or CEFR speaking mock and get a band score."
    />
    <link rel="canonical" href="https://suhbatdosh.vercel.app/" />

    <!-- The app itself only ever runs inside Telegram's webview, but its URL gets
         pasted into chats and channels. These are what renders there. No og:image is
         declared on purpose: pointing at a file that does not exist produces a broken
         card, which looks worse than the text-only one Telegram falls back to. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Suhbatdosh" />
    <meta property="og:title" content="Suhbatdosh — English Speaking Partner" />
    <meta
      property="og:description"
      content="Practise speaking English with real people. Get matched in seconds, or sit an IELTS speaking mock and get a band score."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Telegram's script is what supplies initData, the theme and the viewport
         insets, so nothing can render meaningfully before it has run. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* These values must match --bg / --text-primary in src/styles/global.css.
         The app is dark-first, so a white fallback flashed on every launch before
         the stylesheet arrived. Telegram's own theme colour still wins when it
         provides one. */
      html, body, #root {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--tg-theme-bg-color, #090D14);
        color: var(--tg-theme-text-color, #F8FAFC);
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: light) {
        html, body, #root {
          background: var(--tg-theme-bg-color, #F8FAFC);
          color: var(--tg-theme-text-color, #0F172A);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
